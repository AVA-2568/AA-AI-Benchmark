name: Update AA leaderboard ranking

on:
  schedule:
    # 每月 1 号 06:00 UTC 自动跑
    - cron: "0 6 1 * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, score, refresh README
        run: python scripts/build.py

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update leaderboard ranking"
          file_pattern: "results/aa_providers_scored.csv README.md"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
