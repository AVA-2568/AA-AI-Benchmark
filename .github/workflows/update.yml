name: Update AA leaderboard ranking

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: Run unit tests (quality gate)
        run: python -m pytest -q

      - name: Fetch, score, refresh README
        run: python scripts/build.py

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update leaderboard ranking"
          file_pattern: "results/*.csv results/*.json results/manifest.json results/*.svg README.md"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      # Revert to dacbd/create-issue-action@v2. peter-evans/create-or-update-
      # issue-action@v3 cannot be resolved in this repo (likely a private-repo
      # or allow-list restriction on third-party actions), so the v3 step
      # fails with "repository not found" and breaks the entire workflow.
      # Add run_attempt == 1 so workflow retries don't re-open the same
      # issue every time a retry fails.
      - name: Alert on failure
        if: failure() && github.run_attempt == 1
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "⚠ 月度排名更新失败"
          body: |
            自动排名流水线失败。
            可能原因：AA 页面结构变更、数据源异常、网络超时。
            请检查 Actions 日志。
