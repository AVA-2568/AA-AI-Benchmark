name: Update AA leaderboard ranking

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, score, refresh README
        run: python scripts/build.py

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update leaderboard ranking"
          file_pattern: "results/aa_providers_scored.csv README.md results/validation.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Alert on failure (dedup by label)
        if: failure()
        uses: peter-evans/create-or-update-issue-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "⚠ 月度排名更新失败"
          body: |
            自动排名流水线失败。
            可能原因：AA 页面结构变更、数据源异常、网络超时。
            请检查 Actions 日志。
          labels: monthly-update-failure
